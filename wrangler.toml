name = "business-finder"
pages_build_output_dir = "public"
compatibility_date = "2024-10-01"

[vars]
# Single switch for the base map: "osm" (interim, default) or "webmaps" (target, once api.webmaps.app tiles are fixed).
TILE_SOURCE = "osm"
# Interim OSM base map: OpenFreeMap vector style (no API key).
OSM_STYLE_URL = "https://tiles.openfreemap.org/styles/liberty"
# Target: api.webmaps.app. PLACEHOLDER until its tiles are fixed and the style URL is confirmed.
WEBMAPS_STYLE_URL = "https://api.webmaps.app/styles/default/style.json"
# Optional street-name reverse geocode via Nominatim (cached, policy-friendly). Off by default.
REVERSE_GEOCODE = "off"
# Nearby landmarks: "sample" (bundled Thornleigh demo data, default) or "overpass" (cached OSM Overpass lookup).
LANDMARKS_SOURCE = "sample"
USER_AGENT = "BusinessFinder/0.1 (+https://github.com/eLBirador/business-finder)"

name = "business-finder"
pages_build_output_dir = "public"
compatibility_date = "2024-10-01"

[vars]
# Single switch for the base map: "osm" (interim, default) or "webmaps" (target, once api.webmaps.app tiles are fixed).
TILE_SOURCE = "osm"
# Interim OSM base map: OpenFreeMap vector style (no API key).
OSM_STYLE_URL = "https://tiles.openfreemap.org/styles/liberty"
# Target: api.webmaps.app. PLACEHOLDER until its tiles are fixed and the style URL is confirmed.
WEBMAPS_STYLE_URL = "https://api.webmaps.app/styles/default/style.json"
# Optional street-name reverse geocode via Nominatim (cached, policy-friendly). Off by default.
REVERSE_GEOCODE = "off"
# Nearby landmarks: "sample" (bundled Thornleigh demo data, default) or "overpass" (cached OSM Overpass lookup).
LANDMARKS_SOURCE = "sample"
USER_AGENT = "BusinessFinder/0.1 (+https://github.com/eLBirador/business-finder)"
# Public embed/worker host used in generated tags (PRD 5.1). DNS/custom domain not set up yet (no deploy).
EMBED_HOST = "https://goto.yahaay.com"
# Spam protection (Cloudflare Turnstile). Public site key, same widget as yahaay.com. TURNSTILE_SECRET_KEY is a dashboard Secret.
TURNSTILE_SITE_KEY = "0x4AAAAAAFS92jCFMmH16NYt"
TURNSTILE_HOSTNAMES = "yahaay.com,www.yahaay.com,goto.yahaay.com,business-finder-26j.pages.dev"
# Edit-link email relay on the yahaay.com Worker. BF_MAIL_SECRET is a dashboard Secret (same value on both projects).
MAIL_ENDPOINT = "https://www.yahaay.com/internal/bf-mail"

# Business configs (PRD 8). Created 25 Oct 2026; schema in migrations/.
[[d1_databases]]
binding = "DB"
database_name = "business-finder"
database_id = "36ec6ae1-c3a5-4cdf-a6c9-7dd84231917f"
migrations_dir = "migrations"
